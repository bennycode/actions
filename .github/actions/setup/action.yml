name: Setup tools
description: Install uv (and optionally Node.js) for the security scan jobs.

inputs:
  node:
    description: Set to 'true' to also install Node.js from .nvmrc.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - if: ${{ inputs.node == 'true' }}
      uses: actions/setup-node@v7.0.0
      with:
        node-version-file: '.nvmrc'

    - uses: astral-sh/setup-uv@v10.0.1
      with:
        enable-cache: false
