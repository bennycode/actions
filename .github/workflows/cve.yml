name: 'CVE'

# Reports known vulnerabilities in dependencies via OSV-Scanner, the scanner for
# the open OSV database (https://osv.dev) that GitHub advisories also feed into.
#
# This delegates to the reusable workflow maintained by the OSV-Scanner authors
# rather than reimplementing it: https://github.com/google/osv-scanner-action
#
# Dependabot stays responsible for opening the pull requests that fix findings,
# this workflow only reports them.

on:
  workflow_call:
    inputs:
      scan-args:
        description: 'Arguments for osv-scanner: https://google.github.io/osv-scanner/usage/'
        required: false
        type: string
        default: |-
          -r
          ./
      fail-on-vuln:
        description: 'Fail the build when a vulnerability is found. Off by default so that findings get reported to the "Security" tab instead of blocking merges.'
        required: false
        type: boolean
        default: false

jobs:
  cve:
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.5.1
    permissions:
      actions: read
      contents: read
      security-events: write
    with:
      scan-args: ${{ inputs.scan-args }}
      fail-on-vuln: ${{ inputs.fail-on-vuln }}
