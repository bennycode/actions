name: 'Security'

on:
  workflow_call:
    inputs:
      languages:
        description: 'Comma-separated CodeQL languages: https://docs.github.com/en/code-security/code-scanning/creating-an-advanced-setup-for-code-scanning/codeql-language-support'
        required: false
        type: string
        default: 'javascript-typescript'

jobs:
  codeql:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ inputs.languages }}
      - uses: github/codeql-action/analyze@v4
