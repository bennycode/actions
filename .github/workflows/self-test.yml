name: 'Self-Test'

on:
  workflow_dispatch:
    inputs:
      package:
        description: 'npm package to scan with GuardDog (e.g. express or express@4.18.2). Leave empty to verify the local package.json.'
        required: false
        type: string

permissions:
  contents: read
  security-events: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-security:
    uses: './.github/workflows/test-security.yml'
    with:
      package: ${{ inputs.package }}
