name: 'Test Security (GuardDog)'

on:
  workflow_call:
    inputs: &inputs
      package:
        description: 'npm package name to scan (e.g. express or @scope/pkg). Leave empty to verify the local package.json.'
        required: false
        type: string
      version:
        description: 'Optional package version to scan (e.g. 4.18.2).'
        required: false
        default: 'latest'
        type: string
      sandbox:
        description: 'Run GuardDog inside its kernel-level sandbox. Set to false for local act runs where the sandbox is unavailable.'
        required: false
        default: true
        type: boolean
  workflow_dispatch:
    inputs: *inputs

permissions:
  contents: read

jobs:
  guarddog:
    permissions:
      contents: read
      security-events: write
    name: GuardDog
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: ./.github/actions/setup

      - name: Run GuardDog
        env:
          PACKAGE: ${{ inputs.package }}
          VERSION: ${{ inputs.version }}
          SANDBOX: ${{ inputs.sandbox }}
        run: |
          # pipefail so a GuardDog failure isn't masked by tee's exit code.
          set -o pipefail
          SANDBOX_FLAG=""
          if [ "$SANDBOX" = "false" ]; then
            SANDBOX_FLAG="--no-sandbox"
          fi
          if [ -n "$PACKAGE" ]; then
            # GuardDog scan can't emit SARIF, so keep its native report.
            if [ -n "$VERSION" ] && [ "$VERSION" != "latest" ]; then
              uvx guarddog npm scan $SANDBOX_FLAG "$PACKAGE" --version "$VERSION" | tee security.guarddog.txt
            else
              uvx guarddog npm scan $SANDBOX_FLAG "$PACKAGE" | tee security.guarddog.txt
            fi
          else
            uvx guarddog npm verify $SANDBOX_FLAG --output-format sarif package.json > security.guarddog.sarif
          fi

      - name: Write GuardDog summary
        if: always()
        uses: ./.github/actions/security-summary
        with:
          sarif: security.guarddog.sarif
          text: security.guarddog.txt

      - name: Upload SARIF file to GitHub
        uses: ./.github/actions/upload-security-sarif
        with:
          category: guarddog-builtin
          sarif: security.guarddog.sarif
          package: ${{ inputs.package }}
