name: 'Test Security (OpenSSF Scorecard)'

on:
  workflow_call:
    inputs: &inputs
      package:
        description: 'npm package name to scan (e.g. express or @scope/pkg). Leave empty to verify the local package.json.'
        required: false
        type: string
      version:
        description: 'Optional package version to scan (e.g. 4.18.2).'
        required: false
        default: 'latest'
        type: string
      sandbox:
        description: 'Run GuardDog inside its kernel-level sandbox. Set to false for local act runs where the sandbox is unavailable.'
        required: false
        default: true
        type: boolean
  workflow_dispatch:
    inputs: *inputs

permissions:
  contents: read

jobs:
  scorecard:
    permissions:
      contents: read
      security-events: write
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Run OpenSSF Scorecard (repository)
        if: ${{ inputs.package == '' }}
        uses: ossf/scorecard-action@v2.4.4
        with:
          results_file: security.scorecard.sarif
          results_format: sarif
          publish_results: false

      - name: Run OpenSSF Scorecard (package)
        if: ${{ inputs.package != '' }}
        continue-on-error: true
        env:
          PACKAGE: ${{ inputs.package }}
          GITHUB_AUTH_TOKEN: ${{ github.token }}
        run: |
          # The scorecard binary can't emit SARIF, so keep its native report.
          docker run --rm -e GITHUB_AUTH_TOKEN \
            ghcr.io/ossf/scorecard:v5.5.0 \
            --npm="$PACKAGE" --format=default | tee security.scorecard.txt

      - name: Write Scorecard summary
        if: always()
        uses: ./.github/actions/security-summary
        with:
          sarif: security.scorecard.sarif
          text: security.scorecard.txt

      - name: Upload Scorecard SARIF file to GitHub
        uses: ./.github/actions/upload-security-sarif
        with:
          category: scorecard
          sarif: security.scorecard.sarif
          package: ${{ inputs.package }}
