name: 'Test Security'

on:
  workflow_call:
    inputs:
      package:
        description: 'npm package name to scan (e.g. express or @scope/pkg). Leave empty to verify the local package.json.'
        required: false
        type: string
      version:
        description: 'Optional package version to scan (e.g. 4.18.2).'
        required: false
        default: 'latest'
        type: string
      sandbox:
        description: 'Run GuardDog inside its kernel-level sandbox. Set to false for local act runs where the sandbox is unavailable.'
        required: false
        default: true
        type: boolean
  workflow_dispatch:
    inputs:
      package:
        description: 'npm package name to scan (e.g. express or @scope/pkg). Leave empty to verify the local package.json.'
        required: false
        type: string
      version:
        description: 'Optional package version to scan (e.g. 4.18.2).'
        required: false
        default: 'latest'
        type: string
      sandbox:
        description: 'Run GuardDog inside its kernel-level sandbox. Set to false for local act runs where the sandbox is unavailable.'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

env:
  PACKAGE_SPEC: ${{ inputs.package }}@${{ inputs.version }}

jobs:
  dependency-security:
    permissions:
      contents: read
      security-events: write
    name: GuardDog checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: ./.github/actions/setup

      - name: Run GuardDog
        env:
          PACKAGE: ${{ inputs.package }}
          VERSION: ${{ inputs.version }}
          SANDBOX: ${{ inputs.sandbox }}
        run: |
          SANDBOX_FLAG=""
          if [ "$SANDBOX" = "false" ]; then
            SANDBOX_FLAG="--no-sandbox"
          fi
          if [ -n "$PACKAGE" ]; then
            # GuardDog scan can't emit SARIF, so keep its native report.
            if [ -n "$VERSION" ] && [ "$VERSION" != "latest" ]; then
              uvx guarddog npm scan $SANDBOX_FLAG "$PACKAGE" --version "$VERSION" | tee security.guarddog.txt
            else
              uvx guarddog npm scan $SANDBOX_FLAG "$PACKAGE" | tee security.guarddog.txt
            fi
          else
            uvx guarddog npm verify $SANDBOX_FLAG --output-format sarif package.json > security.guarddog.sarif
          fi

      - name: Upload SARIF file to GitHub
        if: ${{ inputs.package == '' }}
        uses: github/codeql-action/upload-sarif@v4.38.0
        with:
          category: guarddog-builtin
          sarif_file: security.guarddog.sarif

      - name: Write GuardDog summary
        if: always()
        uses: ./.github/actions/security-summary
        with:
          sarif: security.guarddog.sarif
          text: security.guarddog.txt

  code-security:
    permissions:
      contents: read
      security-events: write
    name: Semgrep checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: ./.github/actions/setup
        with:
          node: 'true'

      - name: Run Semgrep
        env:
          PACKAGE: ${{ inputs.package }}
        run: |
          if [ -n "$PACKAGE" ]; then
            # Extract outside the git tree so Semgrep doesn't skip untracked files,
            # and disable its default ignores so shipped dist/ code is scanned.
            DIR="$RUNNER_TEMP/semgrep-target"
            rm -rf "$DIR" && mkdir -p "$DIR"
            npm pack "$PACKAGE_SPEC"
            tar -xzf ./*.tgz -C "$DIR" --strip-components=1
            : > "$DIR/.semgrepignore"
            SARIF="$PWD/security.semgrep.sarif"
            (cd "$DIR" && uvx semgrep scan --config auto --sarif-output "$SARIF" .)
          else
            uvx semgrep scan --config auto --sarif-output security.semgrep.sarif .
          fi

      - name: Write Semgrep summary
        if: always()
        uses: ./.github/actions/security-summary
        with:
          sarif: security.semgrep.sarif

      - name: Upload Semgrep SARIF file to GitHub
        uses: github/codeql-action/upload-sarif@v4.38.0
        with:
          category: semgrep
          sarif_file: security.semgrep.sarif

  repository-security:
    permissions:
      contents: read
      security-events: write
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Run OpenSSF Scorecard (repository)
        if: ${{ inputs.package == '' }}
        uses: ossf/scorecard-action@v2.4.4
        with:
          results_file: security.scorecard.sarif
          results_format: sarif
          publish_results: false

      - name: Upload Scorecard SARIF file to GitHub
        if: ${{ inputs.package == '' }}
        uses: github/codeql-action/upload-sarif@v4.38.0
        with:
          category: scorecard
          sarif_file: security.scorecard.sarif

      - name: Run OpenSSF Scorecard (package)
        if: ${{ inputs.package != '' }}
        continue-on-error: true
        env:
          PACKAGE: ${{ inputs.package }}
          GITHUB_AUTH_TOKEN: ${{ github.token }}
        run: |
          # The scorecard binary can't emit SARIF, so keep its native report.
          docker run --rm -e GITHUB_AUTH_TOKEN \
            ghcr.io/ossf/scorecard:v5.5.0 \
            --npm="$PACKAGE" --format=default | tee security.scorecard.txt

      - name: Write Scorecard summary
        if: always()
        uses: ./.github/actions/security-summary
        with:
          sarif: security.scorecard.sarif
          text: security.scorecard.txt

  vulnerability-security:
    permissions:
      contents: read
      security-events: write
    name: OSV-Scanner checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: ./.github/actions/setup
        with:
          node: 'true'

      - name: Prepare scan target
        id: prep
        env:
          PACKAGE: ${{ inputs.package }}
        run: |
          if [ -n "$PACKAGE" ]; then
            npm pack "$PACKAGE_SPEC"
            mkdir -p unpacked
            tar -xzf ./*.tgz -C unpacked --strip-components=1
            (cd unpacked && npm install --package-lock-only --ignore-scripts)
            echo "path=unpacked" >> "$GITHUB_OUTPUT"
          else
            echo "path=./" >> "$GITHUB_OUTPUT"
          fi

      - name: Run OSV-Scanner
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@v2.5.1
        with:
          scan-args: |-
            --format=sarif
            --output=security.osv.sarif
            --recursive
            ${{ steps.prep.outputs.path }}

      - name: Write OSV-Scanner summary
        if: always()
        uses: ./.github/actions/security-summary
        with:
          sarif: security.osv.sarif

      - name: Upload OSV-Scanner SARIF file to GitHub
        uses: github/codeql-action/upload-sarif@v4.38.0
        with:
          category: osv-scanner
          sarif_file: security.osv.sarif
