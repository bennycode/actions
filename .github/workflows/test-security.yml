name: 'Test Security'

on:
  workflow_call:
    inputs: &inputs
      package:
        description: 'npm package name to scan (e.g. express or @scope/pkg). Leave empty to verify the local package.json.'
        required: false
        type: string
      version:
        description: 'Optional package version to scan (e.g. 4.18.2).'
        required: false
        default: 'latest'
        type: string
      sandbox:
        description: 'Run GuardDog inside its kernel-level sandbox. Set to false for local act runs where the sandbox is unavailable.'
        required: false
        default: true
        type: boolean
  workflow_dispatch:
    inputs: *inputs

permissions:
  contents: read

jobs:
  summary:
    name: Test summary
    runs-on: ubuntu-latest
    steps:
      - name: Write test target summary
        env:
          PACKAGE: ${{ inputs.package }}
          VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$PACKAGE" ]; then
            TARGET="$PACKAGE"
            SCANNED_VERSION="${VERSION:-latest}"
          else
            TARGET="local package.json"
            SCANNED_VERSION="n/a"
          fi
          {
            echo "## Security scan target"
            echo ""
            echo "| Package | Version |"
            echo "| --- | --- |"
            echo "| $TARGET | $SCANNED_VERSION |"
          } >> "$GITHUB_STEP_SUMMARY"

  scan-for-malware:
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/test-security-guarddog.yml
    with:
      package: ${{ inputs.package }}
      version: ${{ inputs.version }}
      sandbox: ${{ inputs.sandbox }}

  scan-for-insecure-code:
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/test-security-semgrep.yml
    with:
      package: ${{ inputs.package }}
      version: ${{ inputs.version }}
      sandbox: ${{ inputs.sandbox }}

  scan-for-misconfiguration:
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/test-security-scorecard.yml
    with:
      package: ${{ inputs.package }}
      version: ${{ inputs.version }}
      sandbox: ${{ inputs.sandbox }}

  scan-for-vulnerabilities:
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/test-security-osv.yml
    with:
      package: ${{ inputs.package }}
      version: ${{ inputs.version }}
      sandbox: ${{ inputs.sandbox }}

  scan-for-secrets:
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/test-security-gitleaks.yml
    with:
      package: ${{ inputs.package }}
      version: ${{ inputs.version }}
      sandbox: ${{ inputs.sandbox }}
